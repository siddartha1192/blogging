services:

  # ── PostgreSQL ────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"   # rotate when a log file hits 10 MB
        max-file: "7"     # keep at most 7 rotated files (~70 MB total)

  # ── Flask / Gunicorn ──────────────────────────────────────────
  app:
    build: .
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Passed through so the entrypoint can use it in the Postgres wait loop
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      # Runtime uploads — persists across rebuilds (admin panel image uploads)
      - uploads_data:/app/static/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "7"

  # ── Nginx reverse-proxy ──────────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-initial.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/app/static/uploads:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
      # Nginx access/error logs on the host — cleaned up by db_backup.sh clean
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - app
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ── Certbot (Let's Encrypt) ──────────────────────────────────
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 6h & wait $${!}; certbot renew; done'"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  # PostgreSQL data — never deleted by docker-compose down (only by docker-compose down -v)
  postgres_data:
  # Runtime upload files — persists across image rebuilds
  uploads_data:
  certbot_www:
  certbot_conf:
